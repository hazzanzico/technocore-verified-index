name: Refresh verified index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh public observations
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run archive
      - run: npm test
      - run: git diff --check
      - name: Commit changed observations
        run: |
          if git diff --quiet -- README.md reports/latest.json reports/latest.md reports/history site/index.html; then
            echo "No observation changes"
            exit 0
          fi
          git config user.name "technocore-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports/latest.json reports/latest.md reports/history site/index.html
          git commit -m "data: refresh verified index"
          git push
