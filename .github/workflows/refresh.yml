name: Refresh verified index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh public observations
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run archive
      - run: npm run test:coverage
      - run: npm run check
      - run: npm run validate
      - run: npm run render
      - run: git diff --check
      - name: Commit changed observations
        run: |
          if git diff --quiet -- README.md reports/latest.json reports/latest.md reports/history site/index.html; then
            echo "No observation changes"
            exit 0
          fi
          git config user.name "technocore-index-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports/latest.json reports/latest.md reports/history site/index.html
          git commit -m "data: refresh verified index"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
